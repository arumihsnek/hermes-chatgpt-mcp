# Include only inside the existing TLS server for kanban-beta.hermesinthenight.duckdns.org.
# It deliberately owns only MCP and OAuth routes; no general Hermes UI route is proxied.

location = /mcp {
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    client_max_body_size 16k;
}

# ChatGPT connectors resolve the declared server URL (the root, which is also
# the OAuth issuer/resource) as the MCP endpoint for session traffic after
# OAuth. Root POSTs therefore must reach the MCP transport instead of nginx's
# static-file 405; GET/HEAD keep serving the landing page. rewrite is the only
# directive legal inside if; the `last` flag re-selects the /mcp location,
# which carries all proxy settings, so nothing is duplicated here. A lone
# error_page 405 does not fire for method-only locations, rewrite/set/proxy
# options are invalid in limit_except, named locations cannot take a URI in
# proxy_pass, and proxy_* directives are invalid in if.
location = / {
    if ($request_method = POST) {
        rewrite ^ /mcp last;
    }
}

# Discovery fallback for connectors whose URL ends in /mcp: OAuth metadata is
# served at the root, so /mcp/.well-known/* is mapped to the root metadata.
location ^~ /mcp/.well-known/ {
    proxy_pass http://127.0.0.1:8791/.well-known/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    proxy_buffering off;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
